services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    # Override the image's default command and start with nodemon.
    command: npm run dev

    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      FORCE_COLOR: "1"

    volumes:
      # Mount the local source so saved changes appear in the container.
      - ../app:/app

      # Keep the image's installed dependencies inside the container.
      # Otherwise, the bind mount above would hide /app/node_modules.
      - /app/node_modules

    # Run the development command from the mounted application directory.
    working_dir: /app

    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

