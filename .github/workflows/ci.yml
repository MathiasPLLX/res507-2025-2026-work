name: CI Preview

on:
  push:
  pull_request:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run preview script
        run: ./scripts/ci-preview.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: labs/20-containerized-node-app/app
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: labs/20-containerized-node-app/app
        run: |
          node --check app.js
          node --check server.js

      - name: Build Docker image
        working-directory: labs/20-containerized-node-app
        run: docker build -t quote-app -f docker/Dockerfile .
      - name: Start database and application
        working-directory: labs/20-containerized-node-app
        run: docker compose -f docker/compose.ci.yaml up -d --build

      - name: Wait for application health
        run: |
          # /health must answer 200 with {"ok":true,"db":"up"} (database reachable).
          for attempt in $(seq 1 30); do
            status=$(curl --silent --connect-timeout 1 --max-time 2 \
              -o /tmp/quote-app-health.json -w '%{http_code}' \
              http://localhost:3000/health || true)
            if [ "$status" = "200" ] \
              && node -e 'const assert = require("node:assert/strict"); const fs = require("node:fs"); const body = JSON.parse(fs.readFileSync("/tmp/quote-app-health.json", "utf8")); assert.equal(body.ok, true); assert.equal(body.db, "up");'; then
              echo "Health check passed (application up, database reachable)"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed (last HTTP status: $status)"
          exit 1

      - name: Show application and database logs
        if: failure()
        working-directory: labs/20-containerized-node-app
        run: |
          docker compose -f docker/compose.ci.yaml ps -a
          docker compose -f docker/compose.ci.yaml logs --no-color

      - name: Stop services
        if: always()
        working-directory: labs/20-containerized-node-app
        run: docker compose -f docker/compose.ci.yaml down -v
